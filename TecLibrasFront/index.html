<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>TecLibras - Painel do Professor</title>
  <!-- Conexão com o arquivo CSS externo -->
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- NOVA SIDEBAR UNIFICADA (Substituiu o Header e a Sidebar antiga) -->
<aside class="sidebar">

    <div class="sidebar-header">
      <img src="img/Logo.png" alt="Logo TecLibras" class="sidebar-logo">
      <div class="logo-text-group">
        <h1 class="logo-title">TecLibras</h1>
        <span class="logo-copy">&copy; 2026</span>
      </div>
    </div>

    <div class="search-container">
      
      <input type="text" id="search-input" placeholder="Buscar sinal..." aria-label="Buscar sinal">
      <button id="clear-search" class="clear-search-btn" title="Limpar busca" type="button">&times;</button>
    </div>

    <!-- Ferramentas da Sidebar (como o Upload) -->
    <div class="sidebar-menu-items">
      <div class="sidebar-tool tool-upload" title="Upload de novo sinal">➕ Novo Sinal</div>
    </div>
    
    <!-- Bloco de Acesso/Usuário empurrado para o final da barra -->
    <div class="user-access">
        <button id="theme-toggle" aria-label="Alternar modo escuro" type="button">🌙</button>
        <div class="user-icon" id="user-menu-btn" title="Login/Cadastro">👤</div>
        
        <div id="user-dropdown" class="user-dropdown">
          <div id="login-form-container">
            <input type="text" id="login-user" placeholder="Usuário ou E-mail">
            <input type="password" id="login-pass" placeholder="Senha">
            <button id="btn-entrar">Entrar</button>
          </div>
          <div id="logged-container" style="display: none;">
            <p>Olá, <span id="username-display">Professor</span>!</p>
            <button id="btn-sair">Sair</button>
          </div>
        </div>
    </div>

  </aside>

  <!-- CONTEÚDO PRINCIPAL À DIREITA -->

  <main class="container" id="sinais-container">
      <p style="text-align: center; width: 100%;">Carregando sinais...</p>
  </main>



  <div id="modal-upload" class="modal">
    <div class="modal-content">
      <h2>Cadastrar Novo Sinal</h2>

      <label>Termo TI</label>
      <input type="text" id="termo_ti" placeholder="Ex: HTML">

      <label>Descrição do Sinal</label>
      <textarea id="descricao_sinal"></textarea>

      <label>ID do Intérprete</label>
      <input type="number" id="id_interprete">

      <h3>Mídias Obrigatórias</h3>
      <label>URL do Vídeo</label>
      <input type="text" id="video_url" placeholder="https://www.youtube.com/watch?v=...">
      
      <label>Imagem Principal</label>
      <input type="file" id="imagem_arquivo" accept="image/*">

      <label>Imagem Secundária - Opcional</label>
      <input type="file" id="imagem_secundaria_arquivo" accept="image/*">

      <div class="modal-buttons">
        <button id="salvar-sinal">Salvar</button>
        <button id="fechar-modal">Cancelar</button>
      </div>
    </div>
  </div>

  <!-- Conexão com o arquivo JavaScript externo -->
  <script src="js/script.js"></script>

  <!-- Aumento da imagem ao toque --> 
  <div id="lightbox-modal" class="lightbox">
    <span class="lightbox-close">&times;</span>
    <img class="lightbox-content" id="lightbox-img" alt="Sinal em tamanho grande">
  </div>

</body>
</html>
